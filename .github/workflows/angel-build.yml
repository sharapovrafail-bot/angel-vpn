name: 'Angel VPN build'

# Builds the Windows installer and Android APKs.
# Runs on every push to the "main" branch and can be started by hand
# (Actions -> Angel VPN build -> Run workflow).
#
# Android signing uses three repository secrets (Settings -> Secrets -> Actions):
#   ANDROID_RELEASE_KEYSTORE_BASE64     keystore file encoded in base64
#   ANDROID_RELEASE_KEYSTORE_KEY_ALIAS  key alias
#   ANDROID_RELEASE_KEYSTORE_KEY_PASS   keystore / key password
# Without them a throw-away key is generated: the APK installs fine, but every
# build then has a different signature, so updates need a reinstall.

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:

  Build-Windows:
    runs-on: windows-latest

    env:
      QT_VERSION: 6.10.1
      QIF_VERSION: 4.7

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup MSVC'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'x64'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project and installer'
      shell: cmd
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        deploy\build.bat --installer ifw

    - name: 'Upload Windows installer'
      uses: actions/upload-artifact@v7
      with:
        name: AngelVPN-windows
        path: deploy/build/AngelVPN_*_windows_x64.exe
        retention-days: 30

# ------------------------------------------------------

  Build-Android:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'android9-10'
            qt_version: '6.10.1'
            min_sdk: 28
            max_sdk: 29
            version_code_offset: 0
          - label: 'android11+'
            qt_version: '6.10.3'
            min_sdk: 30
            max_sdk: ''
            version_code_offset: 1

    env:
      ANDROID_PLATFORM: android-${{ matrix.min_sdk }}
      NDK_VERSION: 27.0.11718014
      QT_VERSION: ${{ matrix.qt_version }}
      QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
      APP_ANDROID_MIN_SDK: ${{ matrix.min_sdk }}
      APP_ANDROID_MAX_SDK: ${{ matrix.max_sdk }}
      APP_ANDROID_VERSION_CODE_OFFSET: ${{ matrix.version_code_offset }}

    steps:
    - name: 'Free disk space'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
        df -h /

    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_x86_64 Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_x86_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_x86 Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_x86'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_armv7 Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_armv7'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_arm64_v8a Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Prepare signing key'
      id: keystore
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_KEY_ALIAS }}
        KEY_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_KEY_PASS }}
      run: |
        if [[ -n "$KEYSTORE_BASE64" ]]; then
          # tolerate line breaks / spaces added when the secret was pasted
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 --decode --ignore-garbage > android.keystore
          if ! keytool -list -keystore android.keystore -storepass "$KEY_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Android keystore secret, alias or password is wrong (keytool cannot open the key)"
            exit 1
          fi
          echo "alias=$KEY_ALIAS" >> $GITHUB_OUTPUT
          echo "::add-mask::$KEY_PASS"
          echo "pass=$KEY_PASS" >> $GITHUB_OUTPUT
        else
          echo "::warning::Android signing secrets are not set - using a temporary key"
          TMP_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$TMP_PASS"
          keytool -genkeypair -keystore android.keystore -storetype PKCS12 -alias angelvpn \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$TMP_PASS" -keypass "$TMP_PASS" \
            -dname "CN=Angel VPN test"
          echo "alias=angelvpn" >> $GITHUB_OUTPUT
          echo "pass=$TMP_PASS" >> $GITHUB_OUTPUT
        fi

    - name: 'Build APK'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
        QT_ANDROID_KEYSTORE_ALIAS: ${{ steps.keystore.outputs.alias }}
        QT_ANDROID_KEYSTORE_STORE_PASS: ${{ steps.keystore.outputs.pass }}
        LABEL: ${{ matrix.label }}
      shell: bash
      run: |
        OUT=deploy/artifacts
        rm -rf $OUT && mkdir -p $OUT

        deploy/build.sh -t android --sign

        VERSION=$(grep CMAKE_PROJECT_VERSION:STATIC deploy/build/CMakeCache.txt | cut -d= -f2)
        APK=$(ls deploy/build/client/android-build/*.apk | head -1)
        mv "$APK" "$OUT/AngelVPN_${VERSION}_${LABEL}.apk"
        ls -l $OUT

    - name: 'Upload APK'
      uses: actions/upload-artifact@v7
      with:
        name: AngelVPN-${{ matrix.label }}
        path: deploy/artifacts/*.apk
        retention-days: 30

# ------------------------------------------------------

  # Every successful build of main is published as the latest GitHub release,
  # so the permanent "releases/latest/download/..." links always give the newest version.
  Release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [ Build-Windows, Build-Android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: 'Add files with permanent names'
      id: names
      shell: bash
      run: |
        VERSION=$(ls dist/AngelVPN_*_windows_x64.exe | sed -E 's/.*AngelVPN_(.+)_windows_x64.exe/\1/')
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"; fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        # versioned files stay for history; fixed names give links that never change:
        # https://github.com/<owner>/<repo>/releases/latest/download/AngelVPN-android.apk
        cd dist
        cp AngelVPN_*_android11+.apk     AngelVPN-android.apk
        cp AngelVPN_*_android9-10.apk    AngelVPN-android9-10.apk
        cp AngelVPN_*_windows_x64.exe    AngelVPN-windows.exe
        ls -l

    - name: 'Publish GitHub release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.names.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: Angel VPN ${{ steps.names.outputs.tag }}
        make_latest: true
        body: |
          **Android 11 и новее** — AngelVPN-android.apk
          **Android 9–10** — AngelVPN-android9-10.apk
          **Windows 10/11** — AngelVPN-windows.exe

          Подписка и ключ: https://t.me/angel_vpn_shop_bot
        files: dist/*
